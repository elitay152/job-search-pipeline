[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "career-evidence-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "python-docx>=1.1,<2", "streamlit>=1.50,<2", "anthropic>=0.40,<1", "openai>=2,<3", "httpx>=0.28,<1", "tiktoken>=0.12,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]
layout = ["PyMuPDF>=1.24,<2"]
[project.scripts]
career = "career_pipeline.cli:main"
[tool.setuptools.packages.find]
include = ["career_pipeline*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
