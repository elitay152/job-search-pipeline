# Workbench theme: deep navy with teal and violet accents.
[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#151F33"
textColor = "#E6ECF5"
linkColor = "#7DD3FC"
borderColor = "#25324D"
showWidgetBorder = true
baseRadius = "0.75rem"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#101A33"
secondaryBackgroundColor = "#1A2747"
textColor = "#E6ECF5"
primaryColor = "#A78BFA"
borderColor = "#25324D"

[client]
toolbarMode = "minimal"
